# Publishes the web build to GitHub Pages. index.pck is over GitHub's 100 MB
# file limit, so it lives on the "build" release and is put back here.
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the game data from the build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download build --repo "${{ github.repository }}" --pattern index.pck --dir site
          cp index.* .nojekyll site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
